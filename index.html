<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/14.6.3/nouislider.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/14.6.3/nouislider.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
  <style>
    #slider {
      margin: 50px;
    }
  </style>
</head>
<body>
  <div id="slider"></div>
  <p>Selected range: <span id="range"></span></p>

  <script>
    var slider = document.getElementById('slider');
    var startDate = moment('2021-01-01');
    var endDate = moment('2021-12-31');
    var dateRange = [startDate.valueOf(), endDate.valueOf()];

    noUiSlider.create(slider, {
      range: {
        min: dateRange[0],
        max: dateRange[1]
      },
      step: 24 * 60 * 60 * 1000, // one day in milliseconds
      start: [dateRange[0], dateRange[1]],
      connect: true,
      format: {
        to: function (value) {
          return moment(value).format('YYYY-MM-DD');
        },
        from: function (value) {
          return moment(value, 'YYYY-MM-DD').valueOf();
        }
      }
    });

    var range = document.getElementById('range');
    slider.noUiSlider.on('update', function (values, handle) {
      range.innerHTML = values.join(' - ');
    });
  </script>
</body>
</html>
